name: Veille officielle des accords Bâtiment Hauts-de-France

on:
  schedule:
    # Chaque jour : archives KALI/JORF et derniers bulletins BOCC.
    - cron: '23 7 * * *'
    # Le dimanche : archive KALI globale, derniers JORF et fenêtre BOCC élargie.
    - cron: '43 6 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Contrôle à lancer : quotidien, complet ou rétroactif'
        required: true
        type: choice
        default: retroactif
        options:
          - quotidien
          - complet
          - retroactif

permissions:
  contents: read
  issues: write

concurrency:
  group: veille-a3c-conventions-hdf
  cancel-in-progress: false

jobs:
  surveillance:
    name: Contrôle indépendant KALI / JORF / BOCC
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Récupérer le programme A3C
        uses: actions/checkout@v4
      - name: Préparer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier le lecteur des documents PDF BOCC
        shell: bash
        run: |
          if command -v pdftotext >/dev/null 2>&1; then
            echo 'Lecteur PDF déjà disponible.'
          else
            sudo apt-get update -qq
            sudo apt-get install -qq -y poppler-utils
          fi
      - name: Exécuter les tests de régression
        run: python -m unittest discover -s outils -p 'test_veille_accords.py' -v
      - name: Examiner les sources officielles indépendantes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENEMENT: ${{ github.event_name }}
          PLANIFICATION: ${{ github.event.schedule }}
          MODE_MANUEL: ${{ inputs.mode }}
        run: |
          MODE='quotidien'
          if [[ "$PLANIFICATION" == '43 6 * * 0' ]]; then
            MODE='complet'
          elif [[ "$EVENEMENT" == 'workflow_dispatch' && -n "$MODE_MANUEL" ]]; then
            MODE="$MODE_MANUEL"
          fi
          echo "Mode A3C V18 : $MODE"
          if [[ "$MODE" == 'retroactif' ]]; then
            python outils/veille_accords.py --mode "$MODE" --rapport rapport_veille.json
          else
            python outils/veille_accords.py --mode "$MODE" --rapport rapport_veille.json --creer-tickets
          fi
      - name: Conserver le rapport de contrôle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-a3c-v18-${{ github.run_id }}
          path: rapport_veille.json
          if-no-files-found: warn
          retention-days: 45
