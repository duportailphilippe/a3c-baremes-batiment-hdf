name: Veille officielle des accords Bâtiment Hauts-de-France

on:
  schedule:
    # Chaque matin : nouvelles archives KALI, JORFSIMPLE (ou JORF) et BOCC.
    - cron: '23 7 * * *'
    # Chaque dimanche : contrôle global KALI et fenêtre BOCC élargie.
    - cron: '43 6 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Contrôle : quotidien, complet ou retroactif'
        required: true
        type: choice
        default: quotidien
        options:
          - quotidien
          - complet
          - retroactif

permissions:
  contents: write  # Uniquement suivi/etat_veille.json, jamais baremes.json.
  issues: write

concurrency:
  group: veille-a3c-conventions-hdf
  cancel-in-progress: false

jobs:
  surveillance:
    name: Veille XML officielle KALI / JORF / BOCC
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - name: Récupérer les fichiers du dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Préparer le lecteur PDF du BOCC
        shell: bash
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y poppler-utils
          fi
      - name: Effectuer les tests de régression
        run: python -m unittest discover -s outils -p 'test_veille_accords.py' -v
      - name: Examiner les archives officielles
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENEMENT: ${{ github.event_name }}
          PLANIFICATION: ${{ github.event.schedule }}
          MODE_MANUEL: ${{ inputs.mode }}
        run: |
          MODE='quotidien'
          if [[ "$PLANIFICATION" == '43 6 * * 0' ]]; then
            MODE='complet'
          elif [[ "$EVENEMENT" == 'workflow_dispatch' && -n "$MODE_MANUEL" ]]; then
            MODE="$MODE_MANUEL"
          fi
          echo "Mode A3C V19 : $MODE"
          if [[ "$MODE" == 'retroactif' ]]; then
            python outils/veille_accords.py --mode "$MODE" --rapport rapport_veille.json
          else
            python outils/veille_accords.py --mode "$MODE" \
              --rapport rapport_veille.json \
              --etat suivi/etat_veille.json \
              --creer-tickets
          fi
      - name: Mémoriser les archives déjà examinées
        # Le mode rétrospectif ne modifie jamais l'état de la veille.
        if: success()
        shell: bash
        run: |
          if [[ -f suivi/etat_veille.json ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add suivi/etat_veille.json
            if ! git diff --cached --quiet; then
              git commit -m 'veille: mémoriser les archives officielles examinées [skip ci]'
              git push origin HEAD:${{ github.ref_name }}
            else
              echo 'Aucune nouvelle archive à mémoriser.'
            fi
          else
            echo 'Aucun état à enregistrer (contrôle rétrospectif ou aucune mise à jour).'
          fi
      - name: Conserver le rapport de veille
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-a3c-v19-${{ github.run_id }}
          path: rapport_veille.json
          if-no-files-found: warn
          retention-days: 60
