name: Veille officielle des accords Bâtiment Hauts-de-France

on:
  schedule:
    # Tous les jours à 07 h 23 UTC : derniers compléments KALI et JORF.
    - cron: '23 7 * * *'
    # Le dimanche à 06 h 43 UTC : KALI global + derniers JORF.
    - cron: '43 6 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Contrôle à lancer : quotidien, complet ou rétroactif'
        required: true
        type: choice
        default: retroactif
        options:
          - quotidien
          - complet
          - retroactif

permissions:
  contents: read
  issues: write

concurrency:
  group: veille-a3c-conventions-hdf
  cancel-in-progress: false

jobs:
  surveillance:
    name: Contrôle DILA / KALI / JORF
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Récupérer le programme A3C
        uses: actions/checkout@v6
      - name: Préparer Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Exécuter les tests de régression
        run: python -m unittest discover -s outils -p 'test_veille_accords.py' -v
      - name: Examiner les publications officielles
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENEMENT: ${{ github.event_name }}
          PLANIFICATION: ${{ github.event.schedule }}
          MODE_MANUEL: ${{ inputs.mode }}
        run: |
          MODE='quotidien'
          if [[ "$PLANIFICATION" == '43 6 * * 0' ]]; then
            MODE='complet'
          elif [[ "$EVENEMENT" == 'workflow_dispatch' && -n "$MODE_MANUEL" ]]; then
            MODE="$MODE_MANUEL"
          fi
          echo "Mode A3C V17 : $MODE"
          if [[ "$MODE" == 'retroactif' ]]; then
            # Aucun ticket historique ; les archives servent à la validation.
            python outils/veille_accords.py --mode "$MODE" --rapport rapport_veille.json
          else
            python outils/veille_accords.py --mode "$MODE" --rapport rapport_veille.json --creer-tickets
          fi
      - name: Conserver le rapport d'audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rapport-a3c-v17-${{ github.run_id }}
          path: rapport_veille.json
          if-no-files-found: warn
          retention-days: 45
